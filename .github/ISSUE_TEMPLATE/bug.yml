name: Bug report
description: Report a reproducible problem (security issues must be reported privately).
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version and Linux distribution
      placeholder: 0.0.1, Debian 12, X11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Remove private process names, usernames, paths and command lines. Use --demo for screenshots when possible.
    validations:
      required: true
